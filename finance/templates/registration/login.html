<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in · Stashy</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%90%BF</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #1e2a44; } .card { border: none; border-radius: .75rem; }</style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
<div class="card p-4 shadow" style="width: 360px;">
    <h4 class="mb-3 text-center">🐿️ Stashy</h4>
    {% if form.errors %}<div class="alert alert-danger py-2">Invalid username or password.</div>{% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Log in</button>
        <input type="hidden" name="next" value="{{ next }}">
    </form>
</div>
</body>
</html>
