{% load static %}
<script>
    // Set the theme before the page paints, so there's no flash of the wrong colors.
    (function () {
        var theme;
        try { theme = localStorage.getItem('stashy-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-bs-theme', theme);
    })();
</script>
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'finance/img/stashy-icon-32.png' %}">
<link rel="icon" type="image/png" sizes="192x192" href="{% static 'finance/img/stashy-icon-192.png' %}">
<link rel="apple-touch-icon" href="{% static 'finance/img/stashy-icon-180.png' %}">
<meta name="theme-color" content="#1d3a2c">
<link rel="stylesheet" href="{% static 'finance/vendor/bootstrap/css/bootstrap.min.css' %}">
<link rel="stylesheet" href="{% static 'finance/vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
<link rel="stylesheet" href="{% static 'finance/vendor/flatpickr/flatpickr.min.css' %}">
