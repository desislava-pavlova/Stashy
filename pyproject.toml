# Tool settings only: Stashy isn't a package that gets installed, so there's no
# [project] table. Run the checks with:
#   .venv\Scripts\ruff.exe check .
#   .venv\Scripts\ruff.exe format .

[tool.ruff]
line-length = 119
target-version = "py312"
extend-exclude = ["migrations", "staticfiles", "stashes", "backups", "logs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "DJ", "SIM", "C4", "RUF"]
ignore = [
    # Django declares fields, choices and Meta options as plain class-level lists by design.
    "RUF012",
    # An if/else with a comment on each branch reads better than a long one-line ternary.
    "SIM108",
]
# Intentional characters: the no-break space (thousands separator), the en dash used in
# user-facing text, and Cyrillic text in date patterns and tests.
allowed-confusables = [" ", "–", "г"]

[tool.ruff.lint.isort]
# Python's own imports, then Django, then the other libraries, then Stashy's own. The blank
# lines between the groups and the module names say which is which, so no group labels.
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]
# Two blank lines after the imports in every file, not only before a def or class.
lines-after-imports = 2

[tool.ruff.lint.isort.sections]
django = ["django"]

[tool.ruff.lint.pycodestyle]
# PEP 8 wraps comments and docstrings at 72, whatever the code's line length is (rule W505).
max-doc-length = 72

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["finance", "audit", "stashy"]
omit = ["*/migrations/*", "*/tests/*", "*/tests.py"]

[tool.coverage.report]
skip_empty = true
