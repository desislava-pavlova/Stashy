# Tool settings only: Stashy isn't a package that gets installed, so there's no
# [project] table. Run the checks with:
#   .venv\Scripts\ruff.exe check .
#   .venv\Scripts\ruff.exe format .

[tool.ruff]
line-length = 119
target-version = "py312"
extend-exclude = ["migrations", "staticfiles", "stashes", "backups", "logs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "DJ", "SIM", "C4", "RUF"]
ignore = [
    # Django declares fields, choices and Meta options as plain class-level lists by design.
    "RUF012",
    # An if/else with a comment on each branch reads better than a long one-line ternary.
    "SIM108",
]
# Intentional characters: the no-break space (thousands separator), the en dash used in
# user-facing text, and Cyrillic text in date patterns and tests.
allowed-confusables = [" ", "–", "г"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["finance", "audit", "stashy"]
omit = ["*/migrations/*", "*/tests/*", "*/tests.py"]

[tool.coverage.report]
skip_empty = true
